<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CommonFund · UX Prototype</title><style>
:root{--ink:#203029;--green:#28664d;--mint:#eaf2eb;--line:#e4e9e3;--muted:#758179;--bg:#f6f7f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:215px 1fr}.side{background:white;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:bold;padding:4px 8px}.mark{background:var(--green);color:white;border-radius:9px;padding:7px;margin-right:8px}.caption,.eyebrow{font-size:10px;font-weight:bold;letter-spacing:1px;color:var(--muted)}.caption{margin:36px 8px 10px}.nav{display:grid;gap:4px}.nav button{border:0;background:white;text-align:left;padding:12px;border-radius:7px;color:#66746b}.nav button:hover,.nav button.on{background:var(--mint);color:var(--green);font-weight:bold}.profile{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px}.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 4vw;color:var(--muted)}.tag{font-size:10px;padding:7px 10px;border:1px solid var(--line);border-radius:20px;color:var(--green)}#screen{max-width:1120px;padding:34px 4vw;margin:auto}.head{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:22px}h1{font-size:30px;margin:6px 0}h2{font-size:17px;margin:6px 0}p{color:var(--muted);line-height:1.55}.btn{border:1px solid #dfe5df;background:white;border-radius:7px;padding:10px 13px;color:var(--ink)}.primary{background:var(--green);color:white;border-color:var(--green)}.panel,.card{background:white;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.value{font-size:24px;font-weight:bold;display:block;margin:10px 0 4px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 140px 100px 40px;align-items:center;gap:12px;border:1px solid #edf0ec;border-radius:8px;padding:12px}.row small{color:var(--muted)}.avatar{display:inline-grid;width:34px;height:34px;place-items:center;background:var(--mint);color:var(--green);border-radius:50%;font-weight:bold;margin-right:8px}.cols{display:grid;grid-template-columns:1.5fr .8fr;gap:14px}.balance{background:var(--mint);padding:17px 20px;border-radius:9px;margin-bottom:14px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left;font-size:12px}th,td{padding:11px 9px;border-bottom:1px solid #edf0ec}th{background:#f8f9f6;color:var(--muted);font-size:10px}.pos{color:var(--green);font-weight:bold}.neg{color:#a84940;font-weight:bold}.form{display:grid;gap:12px}.form label{display:grid;gap:6px;font-size:12px;font-weight:bold}.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:10px;width:100%}.empty{padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:18px;right:18px;padding:12px 16px;background:var(--green);color:white;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:700px){.app{display:block;padding-bottom:60px}.side{position:fixed;z-index:2;bottom:0;left:0;right:0;height:60px;padding:3px;border:0;border-top:1px solid var(--line)}.brand,.caption,.profile{display:none}.nav{grid-template-columns:repeat(5,1fr);height:100%}.nav button{text-align:center;padding:7px 2px;font-size:10px}.top{height:54px;padding:0 14px}#screen{padding:22px 13px}.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.row{grid-template-columns:1fr auto}.row small,.row .members{display:none}.head h1{font-size:25px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="mark">C</span>CommonFund</div><div class="caption">WORKSPACE</div><nav class="nav"><button data-page="home">⌂ Overview</button><button data-page="groups">◎ My groups</button><button data-page="members">♧ Members</button><button data-page="ledger">≡ Ledger</button><button data-page="settings">⚙ Settings</button></nav><div class="profile"><span class="avatar">AM</span>Alex Morgan<br><small>Group treasurer</small></div></aside><main class="main"><header class="top"><span>CommonFund / <b id="crumb">Overview</b></span><span class="tag">INTERACTIVE UX MOCK</span></header><div id="screen"></div></main></div><div id="toast" class="toast" role="status"></div>
<script>
(()=>{const members=[{name:'Alex Morgan',saved:850},{name:'Jordan Lee',saved:700},{name:'Sam Rivera',saved:650},{name:'Taylor Kim',saved:500},{name:'Casey Brown',saved:400}];const groups=[{name:'Sunrise Savings Circle',currency:'USD',members:8,tx:[['Alex Morgan','Contribution','October weekly savings',100,'2026-10-27'],['Jordan Lee','Contribution','October weekly savings',75,'2026-10-26'],['Jordan Lee','Payout','Approved emergency loan',40,'2026-10-24']]},{name:'Garden Co-op Fund',currency:'USD',members:6,tx:[['Alex Morgan','Contribution','Seed fund',60,'2026-10-25']]},{name:'Market Traders Circle',currency:'USD',members:12,tx:[]}];let active=0,page='home';const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cash=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:groups[active].currency}).format(n),bal=g=>g.tx.reduce((n,t)=>n+(t[1]==='Contribution'?t[3]:-t[3]),0),notify=m=>{let t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)},rows=()=>groups.map((g,i)=>`<div class="row"><div><span class="avatar">${esc(g.name[0])}</span><b>${esc(g.name)}</b><br><small>${g.members} members · ${g.currency}</small></div><div><b>${cash(bal(g))}</b><br><small>Available balance</small></div><span class="members">${g.members} members</span><button class="btn" data-open="${i}" aria-label="Open ${esc(g.name)}">↗</button></div>`).join(''),ledger=(list=groups[active].tx)=>`<div class="tablewrap"><table><thead><tr><th>Member</th><th>Type</th><th>Note</th><th>Amount</th><th>Date</th></tr></thead><tbody>${list.length?list.map(t=>`<tr><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td><td class="${t[1]==='Contribution'?'pos':'neg'}">${t[1]==='Contribution'?'+':'−'}${cash(t[3])}</td><td>${esc(t[4])}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">No ledger entries yet. Record the first transaction.</td></tr>'}</tbody></table></div>`;function render(){const g=groups[active],s=$('#screen');$('#crumb').textContent=({home:'Overview',groups:'My groups',group:g.name,members:'Members',ledger:'Ledger',settings:'Settings'})[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('on',b.dataset.page===page||(page==='group'&&b.dataset.page==='groups')));if(page==='home')s.innerHTML=`<div class="head"><div><div class="eyebrow">YOUR COMMUNITY, IN SYNC</div><h1>Good morning, Alex.</h1><p>Clear view of your groups, shared savings, and recent activity.</p></div><button class="btn primary" data-action="newgroup">＋ New group</button></div><div class="stats"><div class="card"><small>Active group balance</small><span class="value">${cash(bal(g))}</span><small>${esc(g.name)}</small></div><div class="card"><small>Groups you manage</small><span class="value">${groups.length}</span><small>All records in one place</small></div><div class="card"><small>Members in active group</small><span class="value">${g.members}</span><small>Saving together</small></div></div><section class="panel"><div class="head"><h2>Your savings groups</h2><button class="btn" data-page="groups">View all →</button></div><div class="rows">${rows()}</div></section><section class="panel"><h2>Recent activity · ${esc(g.name)}</h2>${ledger(g.tx.slice(0,3))}</section>`;if(page==='groups')s.innerHTML=`<div class="head"><div><div class="eyebrow">YOUR WORKSPACE</div><h1>My savings groups</h1><p>Choose a group to review its balance and shared ledger.</p></div><button class="btn primary" data-action="newgroup">＋ New group</button></div><section class="panel"><h2>${groups.length} active groups</h2><div class="rows">${rows()}</div></section>`;if(page==='group')s.innerHTML=`<div class="head"><div><div class="eyebrow">SAVINGS GROUP · ${g.currency}</div><h1>${esc(g.name)}</h1><p>${g.members} members · Started May 2026</p></div><button class="btn" data-action="export">↓ Export CSV</button></div><div class="balance"><small>AVAILABLE GROUP BALANCE</small><span class="value">${cash(bal(g))}</span><small>Contributions received minus payouts</small></div><div class="cols"><div><section class="panel"><div class="head"><h2>Group members · ${g.members}</h2><button class="btn" data-action="addmember">＋ Add member</button></div>${members.slice(0,g.members).map(m=>`<p><span class="avatar">${m.name[0]}</span><b>${esc(m.name)}</b> <small> · Net savings ${cash(m.saved)}</small></p>`).join('')}</section><section class="panel"><h2>Transparent transaction ledger</h2>${ledger()}</section></div><section class="panel"><h2>Record transaction</h2>${form()}</section></div>`;if(page==='ledger')s.innerHTML=`<div class="head"><div><div class="eyebrow">${esc(g.name.toUpperCase())}</div><h1>Transaction ledger</h1><p>Searchable record of contributions and payouts.</p></div><button class="btn primary" data-action="record">＋ Record transaction</button></div><section class="panel"><h2>Balance ${cash(bal(g))} · ${g.tx.length} entries</h2><p><input id="search" placeholder="Search member or note" aria-label="Search ledger"><select id="filter"><option>All types</option><option>Contribution</option><option>Payout</option></select> <button class="btn" data-action="export">↓ Export CSV</button></p><div id="results">${ledger()}</div></section>`;if(page==='members')s.innerHTML=`<div class="head"><div><div class="eyebrow">${esc(g.name.toUpperCase())}</div><h1>Group members</h1><p>Roster and recorded savings for this group.</p></div><button class="btn primary" data-action="addmember">＋ Add member</button></div><section class="panel">${members.slice(0,g.members).map(m=>`<p><span class="avatar">${m.name[0]}</span><b>${esc(m.name)}</b><span style="float:right">${cash(m.saved)} saved</span></p>`).join('')}</section>`;if(page==='settings')s.innerHTML=`<div class="head"><div><div class="eyebrow">YOUR ACCOUNT</div><h1>Settings</h1><p>Manage account and group preferences.</p></div></div><section class="panel"><h2>Personal information</h2><p>Account name <b style="float:right">Alex Morgan</b></p><p>Username <b style="float:right">alexmorgan</b></p><p>Active group <select id="active">${groups.map((x,i)=>`<option value="${i}" ${i===active?'selected':''}>${esc(x.name)}</option>`).join('')}</select></p><p>Group records <b style="float:right;color:var(--green)">Private</b></p></section>`}function form(){return `<form class="form" id="txform"><label>Transaction type<select name="kind"><option>Contribution</option><option>Payout</option></select></label><label>Member<select name="member" required><option value="">Select member</option>${members.slice(0,groups[active].members).map(m=>`<option>${esc(m.name)}</option>`).join('')}</select></label><label>Amount (${groups[active].currency})<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Note<input name="note" maxlength="120" placeholder="Add context for the group"></label><small>Payouts cannot exceed available group balance.</small><button class="btn primary">Save transaction →</button></form>`}function addTx(form){let d=new FormData(form),kind=d.get('kind'),amt=Number(d.get('amount')),name=d.get('member');if(!name||!Number.isFinite(amt)||amt<=0)return notify('Select a member and valid amount.');if(kind==='Payout'&&amt>bal(groups[active]))return notify('Payout exceeds available group balance.');groups[active].tx.unshift([name,kind,d.get('note')||`${kind} recorded`,amt,new Date().toISOString().slice(0,10)]);page='group';render();notify('Transaction recorded in the shared ledger.')}document.addEventListener('click',e=>{let p=e.target.closest('[data-page]'),o=e.target.closest('[data-open]'),a=e.target.closest('[data-action]')?.dataset.action;if(p){page=p.dataset.page;render()}if(o){active=+o.dataset.open;page='group';render()}if(a==='record'){page='ledger';render();$('#txform')?.scrollIntoView()}if(a==='export'){let data=[['Member','Type','Note',`Amount (${groups[active].currency})`,'Date'],...groups[active].tx].map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\n');let u=URL.createObjectURL(new Blob([data],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='group-ledger.csv';a.click();URL.revokeObjectURL(u);notify('Ledger downloaded.')}if(a==='newgroup'){let n=prompt('Group name');if(n){groups.push({name:n,currency:(prompt('Currency code?','USD')||'USD').toUpperCase(),members:0,tx:[]});active=groups.length-1;page='group';render();notify('Group created. Add your first member.')}}if(a==='addmember'){let n=prompt('New member name');if(n){members.push({name:n,saved:0});groups[active].members++;render();notify(n+' added to the group.')}}});document.addEventListener('submit',e=>{if(e.target.id==='txform'){e.preventDefault();addTx(e.target)}});document.addEventListener('input',e=>{if(e.target.id==='search'||e.target.id==='filter'){let q=$('#search').value.toLowerCase(),f=$('#filter').value,list=groups[active].tx.filter(t=>(f==='All types'||t[1]===f)&&t.slice(0,3).join(' ').toLowerCase().includes(q));$('#results').innerHTML=ledger(list)}});document.addEventListener('change',e=>{if(e.target.id==='active'){active=+e.target.value;page='group';render()}});render()})();
</script></body></html>
