services:
  - type: web
    name: commonfund-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24.22.1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
